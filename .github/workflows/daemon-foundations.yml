name: Daemon foundations

on:
  push:
    paths:
      - "src/wavedl/core/**"
      - "src/wavedl/launcher.py"
      - "src/wavedl/distributed_launch.py"
      - "src/wavedl/journal.py"
      - "src/wavedl/test.py"
      - "src/wavedl/train.py"
      - "src/wavedl/runtime.py"
      - "src/wavedl/launch_runtime.py"
      - "src/wavedl/local_startup.py"
      - "src/wavedl/checkpointing.py"
      - "src/wavedl/client.py"
      - "src/wavedl/operations.py"
      - "src/wavedl/utils/**"
      - "src/wavedl_daemon/**"
      - "unit_tests/core/**"
      - "unit_tests/daemon/**"
      - "unit_tests/test_distributed_launch.py"
      - "unit_tests/test_runtime_bootstrap_cleanup.py"
      - "unit_tests/test_runtime_ddp.py"
      - "src/wavedl_daemon/web/**"
      - "tools/**"
      - "tools/verify_native_foundations_report.py"
      - "unit_tests/test_user_owned_pytest.py"
      - "unit_tests/test_ci_required_gates.py"
      - "pyproject.toml"
      - ".github/workflows/daemon-foundations.yml"
  pull_request:
    paths:
      - "src/wavedl/core/**"
      - "src/wavedl/launcher.py"
      - "src/wavedl/distributed_launch.py"
      - "src/wavedl/journal.py"
      - "src/wavedl/test.py"
      - "src/wavedl/train.py"
      - "src/wavedl/runtime.py"
      - "src/wavedl/launch_runtime.py"
      - "src/wavedl/local_startup.py"
      - "src/wavedl/checkpointing.py"
      - "src/wavedl/client.py"
      - "src/wavedl/operations.py"
      - "src/wavedl/utils/**"
      - "src/wavedl_daemon/**"
      - "unit_tests/core/**"
      - "unit_tests/daemon/**"
      - "unit_tests/test_distributed_launch.py"
      - "unit_tests/test_runtime_bootstrap_cleanup.py"
      - "unit_tests/test_runtime_ddp.py"
      - "src/wavedl_daemon/web/**"
      - "tools/**"
      - "tools/verify_native_foundations_report.py"
      - "unit_tests/test_user_owned_pytest.py"
      - "unit_tests/test_ci_required_gates.py"
      - "pyproject.toml"
      - ".github/workflows/daemon-foundations.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release caller must not cancel (or be cancelled by) the standalone lane.
  group: daemon-foundations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-enospc:
    name: Linux real tmpfs ENOSPC / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependency-light storage acceptance tools
        run: python -m pip install "pytest>=8,<9" "httpx>=0.28,<1" "starlette>=1.3.0,<2" "fastapi>=0.162,<1" "pydantic>=2.14,<3" "uvicorn>=0.40,<1" "pyyaml>=6"
      - name: Check strict storage evidence and required gates
        run: python -m pytest --noconftest unit_tests/test_ci_required_gates.py
      - name: Exercise real disk exhaustion on a dedicated bounded mount
        shell: bash
        run: |
          tmpfs_root=$(mktemp -d "$RUNNER_TEMP/wavedl-tmpfs.XXXXXX")
          mounted=0
          cleanup() {
            test_status=$?
            cleanup_status=0
            set +e
            if [ "$mounted" -eq 1 ]; then
              sudo umount "$tmpfs_root" || cleanup_status=$?
            fi
            rmdir "$tmpfs_root" || cleanup_status=$?
            if [ "$test_status" -ne 0 ]; then
              exit "$test_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o "size=4m,mode=700,uid=$(id -u),gid=$(id -g)" tmpfs "$tmpfs_root"
          mounted=1
          WAVEDL_TEST_EMPTY_TMPFS="$tmpfs_root" python -m pytest unit_tests/daemon/test_tmpfs_storage_acceptance.py --confcutdir=unit_tests/daemon -p no:cacheprovider --junitxml=tmpfs-acceptance.xml
          test -z "$(ls -A "$tmpfs_root")"
      - name: Require real storage-failure acceptance with zero skips
        if: always()
        run: python tools/verify_tmpfs_acceptance_report.py tmpfs-acceptance.xml
      - name: Upload isolated storage acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmpfs-enospc-linux-py${{ matrix.python }}
          path: tmpfs-acceptance.xml
          if-no-files-found: warn

  foundations:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Vendored web-asset fixtures exercise the Node manifest producer.
      # Keep this build/test dependency separate from the Python-only runtime.
      - name: Set up Node for web-asset producer tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependency-light test tools
        run: python -m pip install "setuptools>=83.0.0,<85" wheel "pytest>=8,<9" "numpy>=1.24" "scipy>=1.10" "h5py>=3.8" "pyyaml>=6" "starlette>=1.3.0,<2" "fastapi>=0.162,<1" "pydantic>=2.14,<3" "uvicorn>=0.40,<1" "h11>=0.16,<1" "httpx>=0.28,<1" "ruff==0.14.10"
      - name: Verify installed dependency contracts
        run: python -m pip check
      - name: Check daemon coding conventions
        run: python -m ruff check src/wavedl/core src/wavedl/client.py src/wavedl/operations.py src/wavedl/launcher.py src/wavedl/distributed_launch.py src/wavedl/launch_runtime.py src/wavedl/local_startup.py src/wavedl/runtime.py src/wavedl/checkpointing.py src/wavedl/journal.py src/wavedl/train.py src/wavedl/test.py src/wavedl_daemon unit_tests/core unit_tests/daemon
      - name: Check daemon formatting
        run: python -m ruff format --check src/wavedl/core src/wavedl/client.py src/wavedl/operations.py src/wavedl/launcher.py src/wavedl/distributed_launch.py src/wavedl/launch_runtime.py src/wavedl/local_startup.py src/wavedl/runtime.py src/wavedl/checkpointing.py src/wavedl/journal.py src/wavedl/train.py src/wavedl/test.py src/wavedl_daemon unit_tests/core unit_tests/daemon
      # The top-level runtime/cleanup/DDP tests use parent ML fixtures and run in
      # test.yml; this matrix preserves independently runnable light contracts.
      - name: Verify scoped test-process ownership setup and native restoration
        run: python -m pytest unit_tests/test_user_owned_pytest.py --noconftest -q
      - name: Shared contracts without parent ML fixtures
        run: python tools/run_user_owned_pytest.py unit_tests/core --confcutdir=unit_tests/core --junitxml=core-foundations.xml -q
      - name: Native supervision and durable control
        # Collect independent native diagnostics even if core contracts fail.
        # Cancelled runs must not keep doing expensive acceptance work.
        if: ${{ !cancelled() }}
        run: python tools/run_user_owned_pytest.py unit_tests/daemon --confcutdir=unit_tests/daemon --junitxml=daemon-foundations.xml -q
      - name: Require native foundations acceptance reports
        if: always()
        run: python tools/verify_native_foundations_report.py core-foundations.xml daemon-foundations.xml
      - name: Upload foundations test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-foundations-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            core-foundations.xml
            daemon-foundations.xml
          if-no-files-found: warn
