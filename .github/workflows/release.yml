name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install packaging
      - run: python tools/check_release.py --tag "$GITHUB_REF_NAME" --notes-file notes.md --metadata-file metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            notes.md
            metadata.json
  checks:
    needs: validate
    uses: ./.github/workflows/test.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - id: metadata
        run: echo "prerelease=$(jq -r .prerelease metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          files: dist/*
