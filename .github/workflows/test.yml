# WaveDL CI/CD Pipeline
# ======================
# Runs unit tests on every push and pull request to ensure code quality.
#
# Features:
#   - Python 3.11 / 3.12 / 3.13 matrix
#   - Dependency caching for faster runs
#   - CPU-only testing (GPU tests skipped on CI)

name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        runtime: [latest]
        include:
          - {python-version: '3.11', os: ubuntu-latest, runtime: minimum}
          - {python-version: '3.11', os: windows-latest, runtime: latest}
          - {python-version: '3.11', os: macos-latest, runtime: latest}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install minimum ML runtime
        if: matrix.runtime == 'minimum'
        run: pip install torch==2.13.0 torchvision==0.28.0 onnx==1.22.0

      - name: Run unit tests (skip slow architecture tests)
        run: pytest unit_tests/ -v --tb=short -m "not slow"

  architecture:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      ACCELERATE_USE_CPU: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest unit_tests/test_architecture.py -v
      - run: pytest unit_tests/ -v -m "slow" --ignore=unit_tests/test_architecture.py
      - run: python tools/check_distributed.py --work-dir "${{ runner.temp }}/wavedl-ddp"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: pip install dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke_installed.py"
      - run: pip install --force-reinstall --no-deps dist/*.tar.gz
      - name: Test installed sdist outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
