# WaveDL CI/CD Pipeline
# ======================
# Runs unit tests on every push and pull request to ensure code quality.
#
# Features:
#   - Python 3.11 / 3.12 / 3.13 matrix
#   - Dependency caching for faster runs
#   - CPU-only testing (GPU tests skipped on CI)

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        runtime: [latest]
        include:
          - {python-version: '3.11', runtime: minimum}

    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Vendored web-asset fixtures exercise the Node manifest producer.
      # This is a test/build tool, not a dependency of the daemon runtime.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - name: Set up Node for web-asset producer tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml

      - name: Install locked browser dependencies
        working-directory: src/wavedl_daemon/web
        run: pnpm install --frozen-lockfile

      - name: Generate the browser client from the locked source
        working-directory: src/wavedl_daemon/web
        run: pnpm run generate

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Install minimum ML runtime
        if: matrix.runtime == 'minimum'
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 onnx==1.22.0 --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Verify installed dependency contracts
        run: python -m pip check

      - name: Vendor generated browser assets before package tests
        run: python tools/vendor_web_assets.py

      # Keep dependency resolution distinct from the cheap --system-site-packages
      # wheel smoke tests. This one cell supplies an explicit complete wheelhouse;
      # missing dependencies are failures, not accepted optional skips.
      - name: Prepare an isolated CPU wheelhouse
        if: matrix.python-version == '3.11'
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/wheel-constraints.txt"
          python -m pip wheel "." --only-binary=:all: --wheel-dir "$RUNNER_TEMP/wavedl-wheelhouse" --constraint "$RUNNER_TEMP/wheel-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Require dependency-resolved wheel installation outside the checkout
        if: matrix.python-version == '3.11'
        env:
          WAVEDL_ACCEPTANCE_WHEELHOUSE: ${{ runner.temp }}/wavedl-wheelhouse
        run: python -m pytest unit_tests/daemon/test_installed_cli.py --noconftest -k isolated_resolved -v --junitxml=isolated-wheel.xml

      # The supported suite covers core ML, daemon, cleanup and native CPU DDP.
      # Retained historical Qt tests are excluded by unit_tests/conftest.py.
      - name: Run unit tests (skip slow architecture and GPU tests)
        run: python -m pytest unit_tests/ -v --tb=short -m "not slow and not gpu" --junitxml=unit-tests.xml

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-py${{ matrix.python-version }}-${{ matrix.runtime }}
          path: |
            unit-tests.xml
            isolated-wheel.xml
          if-no-files-found: warn

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      ACCELERATE_USE_CPU: "true"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m pytest unit_tests/test_architecture.py -v
      - run: python tools/check_distributed.py --work-dir "${{ runner.temp }}/wavedl-ddp"

  # Mirrors upstream: package metadata and an installed wheel outside the checkout.
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - name: Generate and vendor the locked browser client
        run: |
          pnpm --dir src/wavedl_daemon/web install --frozen-lockfile
          pnpm --dir src/wavedl_daemon/web run generate
          python -m pip install 'starlette>=1.3.0,<2' 'fastapi>=0.162,<1' 'pydantic>=2.14,<3' 'anyio>=4,<5' 'httpx>=0.28,<1'
          python tools/vendor_web_assets.py
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel with CPU PyTorch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wavedl_daemon/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'starlette>=1.3.0,<2' 'fastapi>=0.162,<1' 'pydantic>=2.14,<3' 'anyio>=4,<5' 'httpx>=0.28,<1'
      - run: python ../../../tools/vendor_web_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: wavedl-static-client
          path: src/wavedl_daemon/web/.output/public
          if-no-files-found: error

  daemon-native:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Vendored web-asset fixtures exercise the Node manifest producer.
      # Keep this build/test dependency separate from the Python-only runtime.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - name: Set up Node for web-asset producer tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - name: Install locked browser dependencies
        working-directory: src/wavedl_daemon/web
        run: pnpm install --frozen-lockfile
      - name: Generate the browser client from the locked source
        working-directory: src/wavedl_daemon/web
        run: pnpm run generate
      - name: Vendor generated browser assets before package tests
        run: python tools/vendor_web_assets.py
      - name: Install dependency-light test tools
        run: python -m pip install "setuptools>=83.0.0,<85" wheel "pytest>=8,<9" "numpy>=1.24" "scipy>=1.10" "h5py>=3.8" "pyyaml>=6" "starlette>=1.3.0,<2" "fastapi>=0.162,<1" "pydantic>=2.14,<3" "uvicorn>=0.40,<1" "h11>=0.16,<1" "httpx>=0.28,<1" "ruff==0.14.10"
      # Check test tools before the intentionally dependency-incomplete install.
      - name: Verify installed dependency contracts
        run: python -m pip check
      # The daemon reads its own version from the installed package metadata.
      # --no-deps keeps the trainer's dependencies (torch) out of this job.
      - name: Install the package metadata without dependencies
        run: python -m pip install --no-deps .
      - name: Verify scoped test-process ownership setup and native restoration
        run: python -m pytest unit_tests/test_user_owned_pytest.py --noconftest -q
      - name: Native supervision and durable control
        # Cancelled runs must not keep doing expensive acceptance work.
        if: ${{ !cancelled() }}
        run: python tools/run_user_owned_pytest.py unit_tests/daemon --confcutdir=unit_tests/daemon --junitxml=daemon-foundations.xml -q
      - name: Require native foundations acceptance reports
        if: always()
        run: python tools/verify_native_foundations_report.py daemon-foundations.xml
      - name: Upload foundations test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-foundations-${{ matrix.os }}-py${{ matrix.python }}
          path: daemon-foundations.xml
          if-no-files-found: warn

  windows-installed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    name: Windows CPU / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      WANDB_MODE: disabled
      WAVEDL_ACCEPTANCE_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - name: Install official CPU PyTorch before project dependencies
        if: ${{ success() && !cancelled() }}
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install declared daemon and acceptance dependencies
        if: ${{ success() && !cancelled() }}
        run: |
          python -m pip install -e "." pytest httpx build
          python - <<'PY'
          import subprocess, sys, tomllib
          from pathlib import Path
          requirements = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]["requires"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
          python -m pip check
      - name: Test native installed CLI helpers
        if: ${{ success() && !cancelled() }}
        run: python -m pytest --noconftest unit_tests/daemon/test_installed_cli_native_helpers.py -q
      - name: Generate locked browser assets
        if: ${{ success() && !cancelled() }}
        working-directory: src/wavedl_daemon/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate
      - name: Vendor verified current browser assets
        if: ${{ success() && !cancelled() }}
        run: python tools/vendor_web_assets.py
      # CPU only. This lane does not certify CUDA/GPU, browser automation,
      # Slurm sites, remote filesystems, tagging or publishing.
      - name: Build exact wheel in clean tracked-source staging
        if: ${{ success() && !cancelled() }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          import torch
          from tools.vendor_web_assets import inventory
          assert torch.version.cuda is None and not torch.cuda.is_available(), "CPU PyTorch required"
          checkout = Path.cwd()
          owned = Path(tempfile.mkdtemp(prefix="wavedl-windows-cpu-", dir=os.environ["RUNNER_TEMP"]))
          stage, dist = owned / "source", owned / "dist"
          stage.mkdir()
          archive = owned / "source.zip"
          subprocess.run(["git", "archive", "--format=zip", "HEAD", "-o", str(archive)], check=True)
          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  name = PurePosixPath(member.filename)
                  assert not name.is_absolute() and ".." not in name.parts
              source.extractall(stage)
          assets = checkout / "src/wavedl_daemon/web_assets"
          expected = {path.relative_to(assets).as_posix(): path.read_bytes() for path in assets.rglob("*") if path.is_file()}
          assert inventory(assets, managed=True) == json.loads(expected[".wavedl-assets.json"])
          assert {"index.html", ".wavedl-assets.json"} <= expected.keys()
          target = stage / "src/wavedl_daemon/web_assets"
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(assets, target)
          assert not (stage / "build").exists(), "Clean staging must not reuse build/lib"
          subprocess.run([sys.executable, "-m", "build", "--wheel", "--no-isolation", "--outdir", str(dist), str(stage)], check=True)
          wheels = list(dist.glob("*.whl"))
          assert len(wheels) == 1
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as built:
              names = built.namelist()
              assert not any(name.startswith("wavedl_gui/") for name in names)
              assert not any(token in name.lower() for name in names for token in ("pyqt", "pyside", "qfluent"))
              prefix = "wavedl_daemon/web_assets/"
              actual = {name[len(prefix):]: built.read(name) for name in names if name.startswith(prefix) and not name.endswith("/")}
              assert actual == expected, "Wheel must preserve every current vendored asset byte"
          proof = {"scope": "native Windows installed CPU only", "source_commit": os.environ["GITHUB_SHA"], "python": sys.version, "torch": torch.__version__, "wheel": wheel.name, "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(), "assets": {name: hashlib.sha256(data).hexdigest() for name, data in expected.items()}}
          Path("windows-cpu-artifact.json").write_text(json.dumps(proof, sort_keys=True))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"WAVEDL_ACCEPTANCE_WHEEL={wheel.as_posix()}\nWAVEDL_ACCEPTANCE_WHEELHOUSE={(owned / 'wheelhouse').as_posix()}\n")
          PY
      - name: Resolve complete offline wheelhouse from exact installed constraints
        if: ${{ success() && !cancelled() }}
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/windows-cpu-constraints.txt"
          python -m pip wheel "$WAVEDL_ACCEPTANCE_WHEEL" --only-binary=:all: --wheel-dir "$WAVEDL_ACCEPTANCE_WHEELHOUSE" --constraint "$RUNNER_TEMP/windows-cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run native installed CPU acceptance outside checkout
        if: ${{ success() && !cancelled() }}
        run: python tools/run_user_owned_pytest.py unit_tests/daemon/test_installed_cli.py --confcutdir=unit_tests/daemon -k isolated_resolved --junitxml=windows-cpu-installed.xml -q
      - name: Require exactly one successful native installed CPU case
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("windows-cpu-installed.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 1
          assert cases[0].get("classname") == "unit_tests.daemon.test_installed_cli"
          assert cases[0].get("name") == "test_isolated_resolved_wheelhouse_console_scripts_and_assets"
          assert not any(list(root.iter(kind)) for kind in ("skipped", "failure", "error"))
          PY
      - name: Upload nonsecret Windows CPU acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-py${{ matrix.python-version }}
          path: |
            windows-cpu-installed.xml
            windows-cpu-artifact.json
          if-no-files-found: warn
