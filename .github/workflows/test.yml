# WaveDL CI/CD Pipeline
# ======================
# Runs unit tests on every push and pull request to ensure code quality.
#
# Features:
#   - Python 3.11 / 3.12 / 3.13 matrix
#   - Dependency caching for faster runs
#   - CPU-only testing (GPU tests skipped on CI)

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        runtime: [latest]
        include:
          - {python-version: '3.11', os: ubuntu-latest, runtime: minimum}
          - {python-version: '3.11', os: windows-latest, runtime: latest}
          - {python-version: '3.11', os: macos-latest, runtime: latest}

    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Vendored web-asset fixtures exercise the Node manifest producer.
      # This is a test/build tool, not a dependency of the daemon runtime.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - name: Set up Node for web-asset producer tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml

      - name: Install locked browser dependencies
        working-directory: src/wavedl_daemon/web
        run: pnpm install --frozen-lockfile

      - name: Generate the browser client from the locked source
        working-directory: src/wavedl_daemon/web
        run: pnpm run generate

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.runtime }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.runtime }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            python -m pip install torch torchvision
          else
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e ".[dev]"

      - name: Install minimum ML runtime
        if: matrix.runtime == 'minimum'
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 onnx==1.22.0 --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Verify installed dependency contracts
        run: python -m pip check

      - name: Vendor generated browser assets before package tests
        run: python tools/vendor_web_assets.py

      # Keep dependency resolution distinct from the cheap --system-site-packages
      # wheel smoke tests. Python 3.11 cells supply an explicit complete wheelhouse;
      # missing dependencies are failures, not accepted optional skips.
      - name: Prepare an isolated CPU wheelhouse
        if: matrix.python-version == '3.11'
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/wheel-constraints.txt"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            python -m pip wheel "." --only-binary=:all: --wheel-dir "$RUNNER_TEMP/wavedl-wheelhouse" --constraint "$RUNNER_TEMP/wheel-constraints.txt"
          else
            python -m pip wheel "." --only-binary=:all: --wheel-dir "$RUNNER_TEMP/wavedl-wheelhouse" --constraint "$RUNNER_TEMP/wheel-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Require dependency-resolved wheel installation outside the checkout
        if: matrix.python-version == '3.11'
        env:
          WAVEDL_ACCEPTANCE_WHEELHOUSE: ${{ runner.temp }}/wavedl-wheelhouse
        run: python -m pytest unit_tests/daemon/test_installed_cli.py --noconftest -k isolated_resolved -v --junitxml=isolated-wheel.xml

      # The supported suite covers core ML, daemon, cleanup and native CPU DDP.
      # Retained historical Qt tests are excluded by unit_tests/conftest.py.
      - name: Run unit tests (skip slow architecture and GPU tests)
        run: python -m pytest unit_tests/ -v --tb=short -m "not slow and not gpu" --junitxml=unit-tests.xml

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.runtime }}
          path: |
            unit-tests.xml
            isolated-wheel.xml
          if-no-files-found: warn

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      ACCELERATE_USE_CPU: "true"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m pytest unit_tests/test_architecture.py -v
      - run: python tools/check_distributed.py --work-dir "${{ runner.temp }}/wavedl-ddp"

  # Mirrors upstream: package metadata and an installed wheel outside the checkout.
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - name: Generate and vendor the locked browser client
        run: |
          pnpm --dir src/wavedl_daemon/web install --frozen-lockfile
          pnpm --dir src/wavedl_daemon/web run generate
          python -m pip install 'starlette>=1.3.0,<2' 'fastapi>=0.162,<1' 'pydantic>=2.14,<3' 'anyio>=4,<5' 'httpx>=0.28,<1'
          python tools/vendor_web_assets.py
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel with CPU PyTorch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wavedl_daemon/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'starlette>=1.3.0,<2' 'fastapi>=0.162,<1' 'pydantic>=2.14,<3' 'anyio>=4,<5' 'httpx>=0.28,<1'
      - run: python ../../../tools/vendor_web_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: wavedl-static-client
          path: src/wavedl_daemon/web/.output/public
          if-no-files-found: error
