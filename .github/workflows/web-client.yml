name: Static web client

on:
  workflow_call:
  push:
    paths:
      - 'src/wavedl_daemon/web/**'
      - 'tools/vendor_web_assets.py'
      - 'src/wavedl_daemon/http/static.py'
      - 'src/wavedl_daemon/http/app.py'
      - 'pyproject.toml'
      - 'unit_tests/daemon/test_*web*.py'
      - '.github/workflows/web-client.yml'
  pull_request:
    paths:
      - 'src/wavedl_daemon/web/**'
      - 'tools/vendor_web_assets.py'
      - 'src/wavedl_daemon/http/static.py'
      - 'src/wavedl_daemon/http/app.py'
      - 'pyproject.toml'
      - 'unit_tests/daemon/test_*web*.py'
      - '.github/workflows/web-client.yml'

permissions:
  contents: read

concurrency:
  group: static-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wavedl_daemon/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/wavedl_daemon/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: src/wavedl_daemon/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'starlette>=1.3.0,<2' 'fastapi>=0.162,<1' 'pydantic>=2.14,<3' 'anyio>=4,<5' 'httpx>=0.28,<1'
      - run: python ../../../tools/vendor_web_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: wavedl-static-client
          path: src/wavedl_daemon/web/.output/public
          if-no-files-found: error
