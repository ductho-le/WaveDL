name: Feature Request
description: Suggest a new feature or enhancement for WaveDL
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out this form as completely as possible.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight Checklist
      description: Please ensure you've completed these steps before submitting
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested before
          required: true
        - label: I have checked the [documentation](https://github.com/ductho-le/WaveDL#readme) to confirm this feature doesn't already exist
          required: true
        - label: I have reviewed the [roadmap](https://github.com/ductho-le/WaveDL/discussions) for planned features
          required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this feature fall into?
      options:
        - Model Architecture
        - Data Loading/Processing
        - Training/Optimization
        - Inference/Export
        - Visualization/Plotting
        - Documentation
        - Performance/Efficiency
        - CI/CD
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when... / It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like WaveDL to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: I also considered... / Another approach could be...

  - type: textarea
    id: examples
    attributes:
      label: Use Case Examples
      description: Provide concrete examples of how this feature would be used
      placeholder: |
        Example 1: When analyzing ultrasonic data, I would...
        Example 2: For seismic inversion, this would enable...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: If you have ideas about how this could be implemented, share them here
      placeholder: |
        This could be implemented by...
        - Adding a new parameter to...
        - Creating a new class for...
        - Modifying the existing...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Would significantly improve my workflow
        - Medium - Would be nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to papers, similar implementations, or related issues
      placeholder: |
        - Paper: https://...
        - Similar feature in X: https://...
        - Related issue: #...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the feature request
      placeholder: Any additional information...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you like to help implement this feature?
      options:
        - label: I would be willing to submit a PR to implement this feature
          required: false
        - label: I can provide test data or examples for this feature
          required: false
